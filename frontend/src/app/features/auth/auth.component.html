<div class="min-h-screen bg-gray-900 flex items-center justify-center p-4">
    <div class="bg-gray-800 rounded-2xl shadow-2xl p-8 w-full max-w-md">
  
      <!-- Logo -->
      <div class="text-center mb-8">
        <h1 class="text-4xl font-bold text-emerald-400 mb-2">💣 Saper</h1>
        <p class="text-gray-400 text-sm">Web MVP</p>
      </div>
  
      <!-- Zakładki -->
      <div class="flex rounded-lg bg-gray-700 p-1 mb-6">
        <button
          (click)="mode = 'login'; errorMessage = ''"
          [class]="mode === 'login'
            ? 'flex-1 py-2 rounded-md bg-emerald-500 text-white font-semibold transition-all'
            : 'flex-1 py-2 rounded-md text-gray-400 hover:text-white transition-all'">
          Logowanie
        </button>
        <button
          (click)="mode = 'register'; errorMessage = ''"
          [class]="mode === 'register'
            ? 'flex-1 py-2 rounded-md bg-emerald-500 text-white font-semibold transition-all'
            : 'flex-1 py-2 rounded-md text-gray-400 hover:text-white transition-all'">
          Rejestracja
        </button>
      </div>
  
      <!-- Formularz -->
      <div class="space-y-4">
        <div>
          <label class="block text-gray-400 text-sm mb-1">Login</label>
          <input
            [(ngModel)]="login"
            type="text"
            placeholder="Wpisz login"
            class="w-full bg-gray-700 text-white rounded-lg px-4 py-3 outline-none focus:ring-2 focus:ring-emerald-500 transition-all"/>
        </div>
        <div>
          <label class="block text-gray-400 text-sm mb-1">Hasło</label>
          <input
            [(ngModel)]="password"
            type="password"
            placeholder="Wpisz hasło"
            class="w-full bg-gray-700 text-white rounded-lg px-4 py-3 outline-none focus:ring-2 focus:ring-emerald-500 transition-all"/>
        </div>
  
        <!-- Błąd -->
        @if (errorMessage) {
          <div class="bg-red-900/50 border border-red-500 text-red-300 rounded-lg px-4 py-3 text-sm">
            {{ errorMessage }}
          </div>
        }
  
        <!-- Przycisk -->
        <button
          (click)="submit()"
          [disabled]="loading"
          class="w-full bg-emerald-500 hover:bg-emerald-400 disabled:opacity-50 disabled:cursor-not-allowed text-white font-bold py-3 rounded-lg transition-all mt-2">
          {{ loading ? 'Ładowanie...' : (mode === 'login' ? 'Zaloguj się' : 'Zarejestruj się') }}
        </button>
      </div>
  
    </div>
  </div>
