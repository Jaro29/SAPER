<div class="min-h-screen bg-gray-900 flex flex-col">

    <!-- Nagłówek -->
    <header class="flex items-center justify-between px-8 py-4 bg-gray-800 shadow-lg">
      <h1 class="text-2xl font-bold text-emerald-400">💣 Saper Web MVP</h1>
      <button
        (click)="logout()"
        class="text-gray-400 hover:text-white transition-all text-sm">
        Wyloguj
      </button>
    </header>
  
    <!-- Treść -->
    <main class="flex-1 flex flex-col items-center justify-center p-8">
      <h2 class="text-3xl font-bold text-white mb-2">Wybierz poziom</h2>
      <p class="text-gray-400 mb-10">Kliknij poziom żeby rozpocząć grę</p>
  
      <!-- Karty poziomów -->
      <div class="grid grid-cols-1 md:grid-cols-3 gap-6 w-full max-w-3xl">
  
        <!-- Łatwy -->
        <button
          (click)="startGame('EASY')"
          [disabled]="loading"
          class="bg-gray-800 hover:bg-emerald-900/40 border-2 border-emerald-500 rounded-2xl p-8 text-center transition-all disabled:opacity-50 disabled:cursor-not-allowed group">
          <div class="text-4xl mb-3">😊</div>
          <div class="text-xl font-bold text-emerald-400 mb-1">Łatwy</div>
          <div class="text-gray-400 text-sm">9×9 / 10 min</div>
        </button>
  
        <!-- Średni -->
        <button
          (click)="startGame('MEDIUM')"
          [disabled]="loading"
          class="bg-gray-800 hover:bg-yellow-900/40 border-2 border-yellow-500 rounded-2xl p-8 text-center transition-all disabled:opacity-50 disabled:cursor-not-allowed group">
          <div class="text-4xl mb-3">😐</div>
          <div class="text-xl font-bold text-yellow-400 mb-1">Średni</div>
          <div class="text-gray-400 text-sm">16×16 / 40 min</div>
        </button>
  
        <!-- Trudny -->
        <button
          (click)="startGame('HARD')"
          [disabled]="loading"
          class="bg-gray-800 hover:bg-red-900/40 border-2 border-red-500 rounded-2xl p-8 text-center transition-all disabled:opacity-50 disabled:cursor-not-allowed group">
          <div class="text-4xl mb-3">😱</div>
          <div class="text-xl font-bold text-red-400 mb-1">Trudny</div>
          <div class="text-gray-400 text-sm">30×16 / 99 min</div>
        </button>
  
      </div>
  
      <!-- Błąd -->
      @if (errorMessage) {
        <div class="mt-6 bg-red-900/50 border border-red-500 text-red-300 rounded-lg px-4 py-3 text-sm">
          {{ errorMessage }}
        </div>
      }
  
      <!-- Link do rankingu -->
      <div class="mt-10 text-gray-500 text-sm">
        <a href="/ranking" class="hover:text-emerald-400 transition-all">🏆 Zobacz ranking globalny</a>
      </div>
  
    </main>
  </div>
