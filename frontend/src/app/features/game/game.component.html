<div class="min-h-screen bg-gray-100 flex flex-col items-center py-10 font-sans">
  <div *ngIf="errorMessage" class="mb-4 p-4 text-red-700 bg-red-100 rounded-lg shadow">
    {{ errorMessage }}
  </div>

  <div *ngIf="game" class="bg-white p-6 rounded-xl shadow-lg max-w-full overflow-x-auto">
    
    <!-- Header: Informacje o grze -->
    <div class="flex justify-between items-center mb-6 border-b pb-4">
      <div class="flex flex-col text-gray-700">
        <span class="text-sm font-semibold uppercase text-gray-400">Poziom</span>
        <span class="text-xl font-bold">{{ game.difficulty }}</span>
      </div>

      <div class="flex flex-col items-center justify-center bg-gray-800 text-white rounded-lg px-6 py-2 shadow-inner">
        <span class="text-xs uppercase tracking-wider text-gray-400">Czas</span>
        <span class="text-2xl font-mono font-bold tracking-widest">{{ formattedTime }}</span>
      </div>

      <div class="flex flex-col items-end text-gray-700">
        <span class="text-sm font-semibold uppercase text-gray-400">Pozostało 📦</span>
        <!-- Jeśli wygrana, pokazujemy 0 pudełek -->
        <span class="text-xl font-bold">{{ game.status === 'WON' ? 0 : minesRemaining }}</span>
      </div>
    </div>

    <!-- Pasek statusu wygrana/przegrana -->
    <div *ngIf="game.status === 'WON'" class="mb-6 p-4 bg-green-100 text-green-800 rounded-lg text-center font-bold text-lg shadow-sm border border-green-200">
      🎉 Wygrałeś! Koty znalezione! 😸
    </div>
    <div *ngIf="game.status === 'LOST'" class="mb-6 p-4 bg-red-100 text-red-800 rounded-lg text-center font-bold text-lg shadow-sm border border-red-200">
      🙀 Ups! Trafiłeś w kota!
    </div>

    <!-- Plansza Gry -->
    <div class="inline-block border-4 border-gray-300 rounded-lg bg-gray-200 p-2 shadow-inner select-none">
      <div *ngFor="let row of boardRows" class="flex">
        <div 
          *ngFor="let cell of row" 
          (click)="onCellClick(cell, $event)" 
          (contextmenu)="onCellRightClick(cell, $event)"
          [ngClass]="{
            'bg-white border-gray-300 shadow-none': cell.state === 'REVEALED',
            'bg-gray-400 border-gray-500 shadow-md cursor-pointer': cell.state === 'HIDDEN' || cell.state === 'FLAGGED',
            'hover:bg-gray-300': (cell.state === 'HIDDEN' || cell.state === 'FLAGGED') && game.status === 'IN_PROGRESS',
            'bg-red-200': cell.state === 'REVEALED' && cell.value === -1 && game.status === 'LOST'
          }"
          class="w-10 h-10 m-px border-2 rounded-sm flex items-center justify-center text-lg font-bold">
          
          <!-- Gdy gra WYGRANA - wszystkie miny to zadowolone kotki -->
          <ng-container *ngIf="game.status === 'WON' && cell.value === -1">
            <span class="text-2xl animate-bounce">😻</span>
          </ng-container>

          <!-- Gdy gra TRWA lub JEST PRZEGRANA lub pole nie jest miną po wygranej -->
          <ng-container *ngIf="game.status !== 'WON' || cell.value !== -1">
            
            <!-- Stan: Odkryte -->
            <ng-container *ngIf="cell.state === 'REVEALED'">
              <span *ngIf="cell.value === -1" class="text-2xl">🙀</span>
              <span *ngIf="cell.value! > 0" 
                    [ngClass]="{
                      'text-blue-600': cell.value === 1,
                      'text-green-600': cell.value === 2,
                      'text-red-500': cell.value === 3,
                      'text-purple-700': cell.value === 4,
                      'text-amber-600': cell.value === 5,
                      'text-teal-500': cell.value === 6,
                      'text-black': cell.value === 7,
                      'text-gray-600': cell.value === 8
                    }">
                {{ cell.value }}
              </span>
            </ng-container>

            <!-- Stan: Flaga (Pudełko) podczas gry i przegranej -->
            <ng-container *ngIf="cell.state === 'FLAGGED'">
              📦
            </ng-container>

          </ng-container>

        </div>
      </div>
    </div>

    <!-- Przycisk powrotu -->
    <div class="mt-8 text-center">
      <a routerLink="/lobby" class="inline-block px-6 py-2 bg-blue-600 hover:bg-blue-700 text-white font-semibold rounded-lg shadow transition-colors">
        Wróć do Lobby
      </a>
    </div>

  </div>
</div>
